[package]
name = "ferry-signal"
description = "Ferry signaling server for browser/remote WebRTC transfers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "ferry_signal"
path = "src/lib.rs"

[[bin]]
name = "ferry-signal"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.13"
ipnet = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Same version as axum's WebSocket backend; used to recognise oversized-frame errors.
tungstenite = { version = "0.30", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
