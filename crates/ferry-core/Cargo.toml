[package]
name = "ferry-core"
description = "Ferry's device-to-device transfer engine (LocalSend v2 compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
localsend = { package = "ferry-localsend", path = "../localsend", features = ["full"] }

anyhow = "1"
async-trait = "0.1"
bytes = "1.12"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
http-body-util = "0.1.4"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server", "tokio"] }
if-addrs = "0.15"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2.3"
form_urlencoded = "1.2"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
socket2 = "0.6"
subtle = "2.6"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
unicode-normalization = "0.1.25"
unicode-general-category = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
mime_guess = "2"
directories = "6"
base64 = "0.23"
# WebRTC (ferry-dc/1). All of these are already in the tree through the
# vendored `localsend` crate, so they add no new compilation.
webrtc = "0.14"
ed25519-dalek = { version = "3.0.0", features = ["pem", "rand_core"] }
ring = "0.17"
flate2 = "1.1"
# TURN credentials from ferry-signal (`GET /v1/turn`); same features as the vendored crate.
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls-no-provider", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ferry-signal = { path = "../ferry-signal" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
