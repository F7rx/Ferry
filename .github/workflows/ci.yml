name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -p ferry-core -p ferry-cli -p ferry-signal -p ferry-desktop -- --check
      - name: Clippy
        run: cargo clippy -p ferry-core -p ferry-cli -p ferry-signal --all-targets -- -D warnings
      - name: Test
        run: cargo test --no-fail-fast -p ferry-core -p ferry-cli -p ferry-signal -p ferry-localsend --features ferry-localsend/full

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck -w apps/app
      - name: Unit tests
        run: npm run test -w apps/app
      - name: Build
        run: npm run build -w apps/app

  desktop:
    name: Desktop shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build frontend
        run: npm run build:desktop -w apps/app
      - name: Clippy
        run: cargo clippy -p ferry-desktop --all-targets -- -D warnings
